name: flake8

on:
  push:
  pull_request:

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install flake8
        run: python -m pip install flake8==7.0.0

      - name: Check correctness errors
        run: flake8 prism tools --select=E9,F63,F7,F82,F402,F601
