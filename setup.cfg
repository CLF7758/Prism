[flake8]
exclude =
  squashfs-root
  build
  dist
max-line-length = 100
per-file-ignores =
  # Translation tables are long key/value pairs; their line length is
  # decided by the text being translated, not by style.
  prism/i18n/zh_CN.py: E501

[coverage:run]
source = prism

[tool:pytest]
norecursedirs = squashfs-root build dist tools
# 用标准的 basename 匹配。曾经写成 tests/test_*.py 来排除根目录的
# test_video.py，但那会让 "pytest tests/actions" 这类目录参数静默收集
# 到 0 个测试；排除根目录脚本改用 conftest.py 的 collect_ignore。
python_files = test_*.py
addopts = --cov-report html --cov-config=setup.cfg
